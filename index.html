<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="可力小屋汉化进度目录">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; img-src 'self' https://images.zaimanhua.com https://moe.jitsu.top https://pic.rmb.bdstatic.com data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; base-uri 'self'; object-src 'none'">
    <link rel="icon" href="assets/logo.png" type="image/png">
    <title>可力小屋</title>
    <style>
        :root { color-scheme: light; font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; }
        * { box-sizing: border-box; }
        body { min-width: 320px; min-height: 100vh; margin: 0; color: #4b3a42; background: #ffe8f0; }
        button, input, select { font: inherit; }
        button { cursor: pointer; }
        .topbar { position: sticky; z-index: 10; top: 0; display: flex; align-items: center; gap: 28px; min-height: 70px; padding: 10px max(20px, calc((100vw - 1280px) / 2)); border-bottom: 1px solid rgba(255, 255, 255, .7); background: rgba(255, 244, 248, .9); backdrop-filter: blur(14px); }
        .brand { display: inline-flex; flex: 0 0 auto; align-items: center; gap: 10px; color: inherit; text-decoration: none; }
        .brand img { width: 42px; height: 42px; object-fit: contain; }
        .brand-copy { display: grid; line-height: 1.15; }
        .brand-copy strong { color: #ed649c; font-size: 1rem; }
        .brand-copy span { margin-top: 3px; color: #a48491; font-size: .7rem; }
        .nav-link { color: #76616b; font-size: .9rem; text-decoration: none; }
        .nav-link:hover { color: #ed649c; }
        .page { width: min(100% - 40px, 1120px); margin: 32px auto 0; padding: 30px; border: 1px solid rgba(255, 255, 255, .7); border-radius: 10px; background: rgba(255, 255, 255, .88); box-shadow: 0 12px 32px rgba(122, 67, 91, .14); }
        .hero { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 18px; }
        .hero h1 { margin: 0; color: #ed649c; font-size: clamp(1.35rem, 2.5vw, 1.8rem); }
        .hero p { margin: 8px 0 0; color: #76616b; font-size: .9rem; }
        .updated-at { color: #a48491; font-size: .78rem; white-space: nowrap; }
        .join-card { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; padding: 14px 16px; border: 2px dashed #ffc0d5; border-radius: 6px; background: #fff; }
        .join-card span { display: block; color: #888; font-size: .83rem; }
        .join-card strong { display: block; margin-top: 3px; color: #ed649c; font-size: 1.2rem; }
        .join-button { flex: 0 0 auto; padding: 9px 15px; border-radius: 6px; color: #fff; background: #ef719f; font-size: .86rem; font-weight: 700; text-decoration: none; }
        .join-button:hover { background: #d95888; }
        .filters { display: grid; grid-template-columns: minmax(200px, 2fr) repeat(2, minmax(130px, 1fr)); gap: 10px; padding: 14px; border: 1px solid #f0dce4; border-radius: 7px; background: #fffafd; }
        .field { position: relative; }
        .field input, .field select { width: 100%; height: 38px; padding: 0 11px; border: 1px solid #f0cad8; border-radius: 4px; outline: 0; color: #4b3a42; background: #fff; }
        .field input:focus, .field select:focus { border-color: #ed649c; box-shadow: 0 0 0 2px rgba(237, 100, 156, .16); }
        .field select { appearance: auto; }
        .field input::placeholder { color: #b59da8; }
        .catalog-meta { display: flex; align-items: center; justify-content: space-between; min-height: 50px; color: #9b7d8a; font-size: .84rem; }
        .status { margin: 0; }
        .error { color: #d95888; }
        .catalog { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
        .comic-card { display: flex; min-width: 0; flex-direction: column; overflow: hidden; border: 1px solid #f0dce4; border-radius: 6px; color: inherit; background: #fff; box-shadow: 0 5px 15px rgba(122, 67, 91, .08); text-decoration: none; }
        a.comic-card { transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease; }
        a.comic-card:hover, a.comic-card:focus-visible { border-color: #ed649c; outline: 0; box-shadow: 0 10px 24px rgba(122, 67, 91, .18); transform: translateY(-2px); }
        .cover { position: relative; display: grid; overflow: hidden; aspect-ratio: 3 / 4; place-items: center; background: #fff0f5; }
        .cover img { display: block; width: 100%; height: 100%; object-fit: cover; }
        .cover-placeholder { display: grid; width: 100%; height: 100%; place-items: center; color: #b68598; font-size: .82rem; letter-spacing: .08em; background: linear-gradient(135deg, #fff5f8, #ffe8f0); }
        .cover-placeholder::before { content: "封面"; position: absolute; padding: 4px 7px; border: 1px solid #eac4d3; border-radius: 3px; color: #c392a5; font-size: .68rem; transform: translateY(-20px); }
        .card-body { display: grid; gap: 7px; padding: 10px; }
        .card-title { overflow: hidden; font-size: .96rem; font-weight: 700; line-height: 1.35; text-overflow: ellipsis; white-space: nowrap; }
        .aliases { overflow: hidden; min-height: 1.2em; color: #a48491; font-size: .76rem; text-overflow: ellipsis; white-space: nowrap; }
        .tags { display: flex; min-height: 22px; flex-wrap: wrap; gap: 4px; overflow: hidden; }
        .tag { max-width: 100%; overflow: hidden; padding: 2px 5px; border-radius: 3px; color: #9a6278; background: #fff0f5; font-size: .68rem; text-overflow: ellipsis; white-space: nowrap; }
        .episode { display: grid; gap: 3px; padding-top: 7px; border-top: 1px solid #f4e3ea; color: #866976; font-size: .75rem; }
        .episode-row { display: flex; justify-content: space-between; gap: 8px; }
        .episode-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .progress { flex: 0 0 auto; color: #58a368; }
        .completed { color: #a48491; }
        .card-date { color: #b296a1; font-size: .7rem; }
        .empty { grid-column: 1 / -1; padding: 60px 20px; border: 1px dashed #e5bacb; border-radius: 6px; color: #a48491; text-align: center; }
        .pagination { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 28px 0; }
        .pagination button { min-width: 76px; min-height: 34px; padding: 0 12px; border: 1px solid #ffc0d5; border-radius: 4px; color: #b95c83; background: #fff7fa; }
        .pagination button:hover:not(:disabled) { border-color: #ed649c; color: #d95888; }
        .pagination button:disabled { cursor: not-allowed; opacity: .45; }
        .pagination span { color: #a48491; font-size: .82rem; }
        .footer { margin-top: 28px; padding: 18px 0 0; border-top: 1px solid #f0dce4; color: #a48491; font-size: .78rem; line-height: 1.9; text-align: center; }
        .footer a { color: inherit; text-decoration: none; }
        .footer a:hover { color: #ed649c; text-decoration: underline; }
        .hidden { display: none !important; }
        .mode-audit { color: #303133; background: #f5f7fa; }
        .mode-audit .topbar { border-color: #e4e7ed; background: #fff; }
        .mode-audit .brand-copy strong { color: #303133; }
        .mode-audit .nav-link, .mode-audit .footer { color: #999; }
        .audit-page { width: min(100% - 40px, 560px); margin: 12vh auto; padding: 40px; border: 1px solid #e4e7ed; border-radius: 8px; background: #fff; box-shadow: 0 5px 15px rgba(0, 0, 0, .05); }
        .audit-copy { line-height: 1.8; color: #606266; font-size: .9rem; }
        @media (max-width: 680px) {
            .topbar { gap: 12px; min-height: 60px; padding-inline: 16px; }
            .brand img { width: 36px; height: 36px; }
            .nav-link { display: none; }
            .page { width: min(100% - 28px, 1120px); margin-top: 22px; }
            .hero { align-items: start; flex-direction: column; gap: 5px; }
            .filters { grid-template-columns: 1fr; }
            .catalog { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
            .join-card { align-items: start; flex-direction: column; }
            .join-button { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="/" aria-label="可力小屋首页">
            <img src="assets/logo.png" alt="">
            <span class="brand-copy"><strong>可力小屋</strong><span>对可爱的事物没有抵抗力汉化组</span></span>
        </a>
    </header>
    <main id="communityContent" class="page">
        <section class="hero" aria-labelledby="catalogTitle">
            <div>
                <h1 id="catalogTitle">汉化进度</h1>
            </div>
            <time id="updatedAt" class="updated-at"></time>
        </section>
        <section class="join-card" aria-label="交流群">
            <div><span>欢迎加入交流群</span><strong id="groupNumber"></strong></div>
            <a id="joinButton" class="join-button" target="_blank" rel="noopener noreferrer nofollow">点击加入</a>
        </section>
        <section id="catalog" aria-label="漫画目录">
            <div class="filters">
                <label class="field"><input id="searchInput" type="search" placeholder="搜索漫画名、别称或标签" autocomplete="off"></label>
                <label class="field"><select id="progressFilter" aria-label="筛选进度"><option value="">全部进度</option></select></label>
                <label class="field"><select id="sortSelect" aria-label="排序方式"><option value="updated">按更新时间</option><option value="name">按名称</option></select></label>
            </div>
            <div class="catalog-meta"><p id="status" class="status" role="status">正在加载目录…</p></div>
            <div id="comicGrid" class="catalog"></div>
            <nav id="pagination" class="pagination hidden" aria-label="目录分页">
                <button id="previousPage" type="button">上一页</button>
                <span id="pageIndicator"></span>
                <button id="nextPage" type="button">下一页</button>
            </nav>
        </section>
        <footer id="footer" class="footer"></footer>
    </main>
    <main id="auditContent" class="audit-page hidden">
        <p class="audit-copy"><strong>System Status: Online</strong><br>“可力小屋”是个人用于存放计算机技术学习笔记、代码片段的数字化空间。仅用于技术记录，不涉及经营性业务。</p>
        <footer id="auditFooter" class="footer"></footer>
    </main>
    <script>
        const siteConfig = {
            title: "可力小屋",
            catalogUrl: "/api/catalog",
            pageSize: 24,
            forceAuditMode: false,
            auditDates: { month: 1, startDay: 19, endDay: 30 },
            community: {
                backgroundImage: "https://moe.jitsu.top/img",
                groupNumber: "1055588708",
                joinUrl: "https://qm.qq.com/q/Iciv8Fk1SQ"
            },
            audit: {
                slogan: "Personal Code Repository / 技术知识库",
                icp: { text: "苏ICP备2026003693号", url: "https://beian.miit.gov.cn/" },
                police: { text: "苏公网安备 32050802012501号", url: "http://www.beian.gov.cn/portal/registerSystemInfo?recordcode=32050802012501" }
            }
        };

        const state = { items: [], page: 1 };
        const elements = {
            comicGrid: document.getElementById("comicGrid"),
            groupNumber: document.getElementById("groupNumber"),
            joinButton: document.getElementById("joinButton"),
            pagination: document.getElementById("pagination"),
            progressFilter: document.getElementById("progressFilter"),
            previousPage: document.getElementById("previousPage"),
            nextPage: document.getElementById("nextPage"),
            pageIndicator: document.getElementById("pageIndicator"),
            searchInput: document.getElementById("searchInput"),
            sortSelect: document.getElementById("sortSelect"),
            status: document.getElementById("status"),
            updatedAt: document.getElementById("updatedAt")
        };

        function createElement(tagName, properties = {}) {
            const element = document.createElement(tagName);
            for (const [key, value] of Object.entries(properties)) {
                element[key] = value;
            }
            return element;
        }

        function isAuditMode() {
            const { month, startDay, endDay } = siteConfig.auditDates;
            const today = new Date();
            return siteConfig.forceAuditMode || (
                today.getMonth() + 1 === month &&
                today.getDate() >= startDay &&
                today.getDate() <= endDay
            );
        }

        function formatDate(value) {
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return "更新时间未知";
            return new Intl.DateTimeFormat("zh-CN", {
                year: "numeric", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit"
            }).format(date);
        }

        function isAllowedUrl(value, host, pathPrefix = "") {
            try {
                const url = new URL(value);
                return url.protocol === "https:" && url.hostname === host && url.pathname.startsWith(pathPrefix);
            } catch {
                return false;
            }
        }

        function normalizeItem(value) {
            if (!value || typeof value !== "object" || typeof value.name !== "string") return null;
            const aliases = Array.isArray(value.aliases) ? value.aliases.filter((item) => typeof item === "string") : [];
            const tags = Array.isArray(value.tags) ? value.tags.filter((item) => typeof item === "string") : [];
            const currentEpisode = value.currentEpisode && typeof value.currentEpisode === "object" ? value.currentEpisode : null;
            return {
                name: value.name,
                aliases,
                tags,
                currentEpisode,
                completedEpisodeCount: Number.isInteger(value.completedEpisodeCount) ? value.completedEpisodeCount : 0,
                episodeCount: Number.isInteger(value.episodeCount) ? value.episodeCount : 0,
                updatedAt: typeof value.updatedAt === "string" ? value.updatedAt : "",
                coverUrl: isAllowedUrl(value.coverUrl, "images.zaimanhua.com", "/webpic/") ? value.coverUrl : "",
                detailUrl: isAllowedUrl(value.detailUrl, "manhua.zaimanhua.com", "/details/") ? value.detailUrl : ""
            };
        }

        function getFilteredItems() {
            const keyword = elements.searchInput.value.trim().toLocaleLowerCase();
            const progress = elements.progressFilter.value;
            const filteredItems = state.items.filter((item) => {
                const searchable = [item.name, ...item.aliases, ...item.tags].join(" ").toLocaleLowerCase();
                const itemProgress = item.currentEpisode?.progress || "已完结";
                return (!keyword || searchable.includes(keyword)) && (!progress || itemProgress === progress);
            });
            return filteredItems.sort((left, right) => {
                if (elements.sortSelect.value === "name") return left.name.localeCompare(right.name, "zh-CN");
                return new Date(right.updatedAt).getTime() - new Date(left.updatedAt).getTime();
            });
        }

        function appendCover(card, item) {
            const cover = createElement("div", { className: "cover" });
            const addPlaceholder = () => cover.replaceChildren(createElement("div", { className: "cover-placeholder", textContent: "暂无封面" }));
            if (!item.coverUrl) {
                addPlaceholder();
            } else {
                const image = createElement("img", {
                    src: item.coverUrl,
                    alt: `${item.name} 封面`,
                    loading: "lazy",
                    referrerPolicy: "no-referrer"
                });
                image.addEventListener("error", addPlaceholder, { once: true });
                cover.append(image);
            }
            card.append(cover);
        }

        function createCard(item) {
            const card = item.detailUrl
                ? createElement("a", { className: "comic-card", href: item.detailUrl, target: "_blank", rel: "noopener noreferrer", referrerPolicy: "no-referrer" })
                : createElement("article", { className: "comic-card" });
            appendCover(card, item);
            const body = createElement("div", { className: "card-body" });
            body.append(createElement("div", { className: "card-title", textContent: item.name }));
            body.append(createElement("div", { className: "aliases", textContent: item.aliases.join(" / ") || "暂无别称" }));
            const tags = createElement("div", { className: "tags" });
            item.tags.slice(0, 5).forEach((tag) => tags.append(createElement("span", { className: "tag", textContent: tag })));
            body.append(tags);
            const episode = createElement("div", { className: "episode" });
            if (item.currentEpisode) {
                const row = createElement("div", { className: "episode-row" });
                row.append(
                    createElement("span", { className: "episode-title", textContent: item.currentEpisode.title || "当前话数未知" }),
                    createElement("span", { className: "progress", textContent: item.currentEpisode.progress || "进行中" })
                );
                episode.append(row);
            } else {
                episode.append(createElement("span", { className: "completed", textContent: item.episodeCount ? "已完结" : "暂无话数" }));
            }
            episode.append(createElement("span", { textContent: `完成 ${item.completedEpisodeCount} / ${item.episodeCount} 话` }));
            body.append(episode);
            body.append(createElement("time", { className: "card-date", textContent: formatDate(item.updatedAt), dateTime: item.updatedAt || "" }));
            card.append(body);
            return card;
        }

        function renderCatalog() {
            const items = getFilteredItems();
            const pageCount = Math.max(1, Math.ceil(items.length / siteConfig.pageSize));
            state.page = Math.min(state.page, pageCount);
            const start = (state.page - 1) * siteConfig.pageSize;
            const pageItems = items.slice(start, start + siteConfig.pageSize);
            elements.comicGrid.replaceChildren();
            if (!pageItems.length) {
                elements.comicGrid.append(createElement("p", { className: "empty", textContent: "没有符合条件的漫画项目" }));
            } else {
                pageItems.forEach((item) => elements.comicGrid.append(createCard(item)));
            }
            elements.status.textContent = `共 ${items.length} 个项目`;
            elements.status.classList.remove("error");
            elements.pagination.classList.toggle("hidden", pageCount <= 1);
            elements.previousPage.disabled = state.page === 1;
            elements.nextPage.disabled = state.page === pageCount;
            elements.pageIndicator.textContent = `${state.page} / ${pageCount}`;
        }

        function populateProgressFilter() {
            const values = [...new Set(state.items.map((item) => item.currentEpisode?.progress || "已完结"))].sort((left, right) => left.localeCompare(right, "zh-CN"));
            values.forEach((value) => elements.progressFilter.append(createElement("option", { value, textContent: value })));
        }

        async function loadCatalog() {
            try {
                const response = await fetch(siteConfig.catalogUrl, { cache: "no-cache" });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const catalog = await response.json();
                if (!catalog || !Array.isArray(catalog.items)) throw new Error("目录数据格式无效");
                state.items = catalog.items.map(normalizeItem).filter(Boolean);
                elements.updatedAt.textContent = catalog.generatedAt ? `数据更新：${formatDate(catalog.generatedAt)}` : "";
                populateProgressFilter();
                renderCatalog();
            } catch (error) {
                elements.status.textContent = "目录数据暂时不可用，请稍后刷新重试。";
                elements.status.classList.add("error");
                elements.comicGrid.replaceChildren(createElement("p", { className: "empty", textContent: "无法加载漫画目录" }));
                console.error("Failed to load catalog:", error);
            }
        }

        function renderCommunity() {
            const { community } = siteConfig;
            document.title = siteConfig.title;
            document.body.style.backgroundImage = `url("${community.backgroundImage}")`;
            document.body.style.backgroundPosition = "center";
            document.body.style.backgroundSize = "cover";
            document.body.style.backgroundAttachment = "fixed";
            document.body.style.backgroundRepeat = "no-repeat";
            elements.groupNumber.textContent = community.groupNumber;
            elements.joinButton.href = community.joinUrl;
            elements.searchInput.addEventListener("input", () => { state.page = 1; renderCatalog(); });
            elements.progressFilter.addEventListener("change", () => { state.page = 1; renderCatalog(); });
            elements.sortSelect.addEventListener("change", () => { state.page = 1; renderCatalog(); });
            elements.previousPage.addEventListener("click", () => { state.page -= 1; renderCatalog(); });
            elements.nextPage.addEventListener("click", () => { state.page += 1; renderCatalog(); });
            loadCatalog();
        }

        function renderFooter(audit) {
            const footer = document.getElementById(audit ? "auditFooter" : "footer");
            const year = new Date().getFullYear();
            if (!audit) {
                footer.textContent = `© ${year} Keli Group`;
                return;
            }
            const { icp, police } = siteConfig.audit;
            [icp, police].forEach((record) => {
                footer.append(createElement("a", { href: record.url, target: "_blank", rel: "noopener noreferrer", textContent: record.text }), document.createElement("br"));
            });
            footer.append(`© ${year} Personal Tech Blog`);
        }

        function initPage() {
            const audit = isAuditMode();
            document.body.classList.toggle("mode-audit", audit);
            if (audit) document.body.style.backgroundImage = "";
            document.getElementById("communityContent").classList.toggle("hidden", audit);
            document.getElementById("auditContent").classList.toggle("hidden", !audit);
            if (audit) {
                document.title = siteConfig.title;
            } else {
                renderCommunity();
            }
            renderFooter(audit);
        }

        initPage();
    </script>
</body>
</html>
